<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Options</title>
    <style>
        body {
            min-width: 320px;
            max-width: 360px;
            margin: 0;
            padding: 12px 16px;
            font-family: system-ui, sans-serif;
            font-size: 13px;
            color: #202124;
        }

        .option {
            display: flex;
            gap: 10px;
            padding: 10px 0;
        }

        .option + .option {
            border-top: 1px solid #e8eaed;
        }

        .option input[type="checkbox"] {
            flex-shrink: 0;
            margin-top: 2px;
            width: 14px;
            height: 14px;
            cursor: pointer;
        }

        .option input[type="checkbox"]:disabled {
            cursor: default;
        }

        .option-text {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .option-label {
            font-weight: 500;
            line-height: 1.3;
            cursor: pointer;
        }

        .option input[type="checkbox"]:disabled ~ .option-text .option-label {
            color: #5f6368;
            cursor: default;
        }

        .option-desc {
            font-size: 11.5px;
            color: #5f6368;
            line-height: 1.4;
        }
    </style>
</head>

<body>
    <form id="form">
        <label class="option">
            <input type="checkbox" name="jumpOverUnavailableTab" checked disabled />
            <div class="option-text">
                <span class="option-label">Jump over unavailable tabs</span>
                <span class="option-desc">Chrome does not allow extensions to interact with certain tabs (New Tab, chrome://* pages, etc.). These are automatically skipped — this behavior cannot be disabled.</span>
            </div>
        </label>
        <label class="option">
            <input type="checkbox" name="cyclicSwitchTab" />
            <div class="option-text">
                <span class="option-label">Cyclic tab switching</span>
                <span class="option-desc">When enabled, scrolling past the last tab wraps around to the first, and vice versa.</span>
            </div>
        </label>
    </form>
    <script type="text/javascript" src="popup.js"></script>
</body>

</html>
