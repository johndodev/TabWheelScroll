name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build Chrome zip
        run: |
          cp src/manifest.chrome.json src/manifest.json
          cd src && zip -r "../tab-wheel-scroll-chrome-${{ steps.version.outputs.version }}.zip" . \
            -x "manifest.chrome.json" \
            -x "manifest.edge.json" \
            -x "manifest.firefox.json" && \
          rm manifest.json

      - name: Build Edge zip
        run: |
          cp src/manifest.edge.json src/manifest.json
          cd src && zip -r "../tab-wheel-scroll-edge-${{ steps.version.outputs.version }}.zip" . \
            -x "manifest.chrome.json" \
            -x "manifest.edge.json" \
            -x "manifest.firefox.json" && \
          rm manifest.json

      - name: Build Firefox zip
        run: |
          cp src/manifest.firefox.json src/manifest.json
          cd src && zip -r "../tab-wheel-scroll-firefox-${{ steps.version.outputs.version }}.zip" . \
            -x "manifest.chrome.json" \
            -x "manifest.edge.json" \
            -x "manifest.firefox.json" && \
          rm manifest.json

      - name: Extract changelog for version
        id: changelog
        run: |
          version="${{ steps.version.outputs.version }}"
          body=$(sed -n "/^## \[${version}\]/,/^## \[/{ /^## \[${version}\]/d; /^## \[/d; p }" CHANGELOG.md)
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$body" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.body }}
          files: |
            tab-wheel-scroll-chrome-${{ steps.version.outputs.version }}.zip
            tab-wheel-scroll-edge-${{ steps.version.outputs.version }}.zip
            tab-wheel-scroll-firefox-${{ steps.version.outputs.version }}.zip
